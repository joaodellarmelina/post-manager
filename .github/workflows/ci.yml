# Type-checks every push and pull request; the app has no test suite yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: node -e "require('./electron/posts.js'); require('./electron/links.js'); require('./electron/instructions.js')"
